<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MyOS 邀请码生成器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", sans-serif;
    background: #F7F7F5;
    color: #111111;
    min-height: 100vh;
    padding: 40px 20px;
  }
  .container { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
  .sub { font-size: 13px; color: #777; margin-bottom: 32px; }
  .card {
    background: #fff;
    border: 1px solid #E5E5E2;
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 16px;
  }
  label { display: block; font-size: 12px; color: #777; margin-bottom: 6px; }
  input, select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #E5E5E2;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 12px;
    background: #F7F7F5;
  }
  button {
    width: 100%;
    padding: 12px;
    background: #111;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  .code-list { margin-top: 16px; }
  .code-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    border: 1px solid #E5E5E2;
    border-radius: 8px;
    margin-bottom: 8px;
    font-family: "SF Mono", Monaco, monospace;
    font-size: 13px;
  }
  .copy {
    background: none;
    border: 1px solid #E5E5E2;
    color: #777;
    padding: 4px 10px;
    font-size: 11px;
    width: auto;
  }
  .hint { font-size: 11px; color: #777; margin-top: 12px; line-height: 1.6; }
</style>
</head>
<body>
<div class="container">
  <h1>MyOS 邀请码生成器</h1>
  <p class="sub">生成邀请码发给客户，客户输入后解锁全部功能</p>

  <div class="card">
    <label>数量</label>
    <select id="count">
      <option value="1">1 个</option>
      <option value="5" selected>5 个</option>
      <option value="10">10 个</option>
    </select>
    <button onclick="generate()">生成邀请码</button>
    <div class="code-list" id="list"></div>
    <p class="hint">
      生成的邀请码格式：MYOS-2026-XXXX-YYYY<br/>
      客户在 MyOS 设置页输入后即可解锁全部功能。<br/>
      生成的邀请码直接有效，不需要改代码重新部署。
    </p>
  </div>
</div>

<script>
const SECRET = 'myos-secret-2026';

function hashCode(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash = hash & hash;
  }
  return Math.abs(hash).toString(36).toUpperCase();
}

function generate() {
  const count = parseInt(document.getElementById('count').value);
  const list = document.getElementById('list');
  list.innerHTML = '';
  for (let i = 0; i < count; i++) {
    const randomPart = Math.random().toString(36).slice(2, 6).toUpperCase();
    const checkPart = (hashCode(randomPart + SECRET) + 'XXXX').slice(0, 4).toUpperCase();
    const code = 'MYOS-2026-' + randomPart + '-' + checkPart;
    const item = document.createElement('div');
    item.className = 'code-item';
    item.innerHTML = '<span>' + code + '</span><button class="copy" onclick="copy(\'' + code + '\', this)">复制</button>';
    list.appendChild(item);
  }
}
function copy(code, btn) {
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = '已复制';
    setTimeout(() => btn.textContent = '复制', 1500);
  });
}
</script>
</body>
</html>
